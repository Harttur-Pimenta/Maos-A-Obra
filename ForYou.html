<!------ JAVA SCRIPT Play/Pause -------->   
    <script>

        document.querySelectorAll('video').forEach(video => {
            video.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });
        });

    </script>
